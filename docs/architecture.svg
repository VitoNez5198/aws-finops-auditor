<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Arquitectura Serverless de AWS FinOps Auditor">
  <defs>
    <style>
      .diag-bg { fill: #111720; }
      .diag-zone { fill: rgba(148, 163, 184, 0.03); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.1; stroke-dasharray: 4 3; }
      .diag-zone-label { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 9px; font-weight: 600; }
      .diag-box { fill: #17202c; stroke: rgba(148, 163, 184, 0.35); stroke-width: 1.3; }
      .diag-box-accent { fill: rgba(91, 164, 245, 0.12); stroke: #5ba4f5; stroke-width: 1.3; }
      .diag-box-ok { fill: rgba(52, 211, 153, 0.10); stroke: #34d399; stroke-width: 1.3; }
      .diag-label { fill: #f0f6fc; font-family: 'Fira Code', Consolas, monospace; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .diag-sub { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8.5px; text-anchor: middle; }
      .diag-edge { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8px; }
      .diag-line { fill: none; stroke: #94a3b8; stroke-width: 1.25; }
      .diag-line-dashed { fill: none; stroke: #5ba4f5; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .diag-arrow { fill: #94a3b8; }
      .diag-arrow-accent { fill: #5ba4f5; }
    </style>
    <marker id="arr-finops" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
    <marker id="arr-finops-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow-accent" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="diag-bg" x="0" y="0" width="640" height="360" rx="8" />

  <!-- Zona CI/CD -->
  <rect class="diag-zone" x="16" y="16" width="144" height="328" rx="8" />
  <text class="diag-zone-label" x="26" y="33">CI/CD · GitHub Actions</text>

  <rect class="diag-box" x="26" y="54" width="124" height="48" rx="6" />
  <text class="diag-label" x="88" y="75">GitHub Repo</text>
  <text class="diag-sub" x="88" y="90">Push / PR a main</text>

  <rect class="diag-box" x="26" y="154" width="124" height="52" rx="6" />
  <text class="diag-label" x="88" y="177">Job 1: Tests</text>
  <text class="diag-sub" x="88" y="192">pytest + moto</text>

  <rect class="diag-box-accent" x="26" y="246" width="124" height="52" rx="6" />
  <text class="diag-label" x="88" y="269">Job 2: Deploy</text>
  <text class="diag-sub" x="88" y="284">Terraform Apply</text>

  <!-- Zona AWS Cloud -->
  <rect class="diag-zone" x="180" y="16" width="316" height="328" rx="8" />
  <text class="diag-zone-label" x="192" y="33">AWS Cloud (us-east-1 · Terraform IaC)</text>

  <rect class="diag-box-accent" x="194" y="54" width="134" height="48" rx="6" />
  <text class="diag-label" x="261" y="75">EventBridge Cron</text>
  <text class="diag-sub" x="261" y="90">13:00 UTC diario</text>

  <rect class="diag-box-accent" x="194" y="154" width="134" height="54" rx="6" />
  <text class="diag-label" x="261" y="178">AWS Lambda</text>
  <text class="diag-sub" x="261" y="193">Py 3.11 · 128 MB</text>

  <rect class="diag-box-ok" x="194" y="246" width="134" height="52" rx="6" />
  <text class="diag-label" x="261" y="269">IAM Least Priv</text>
  <text class="diag-sub" x="261" y="284">EC2 + CE ReadOnly</text>

  <rect class="diag-box" x="358" y="54" width="124" height="48" rx="6" />
  <text class="diag-label" x="420" y="75">Amazon EC2 API</text>
  <text class="diag-sub" x="420" y="90">DescribeInstances</text>

  <rect class="diag-box" x="358" y="118" width="124" height="48" rx="6" />
  <text class="diag-label" x="420" y="139">Cost Explorer</text>
  <text class="diag-sub" x="420" y="154">GetCostAndUsage</text>

  <rect class="diag-box" x="358" y="246" width="124" height="52" rx="6" />
  <text class="diag-label" x="420" y="269">CloudWatch Logs</text>
  <text class="diag-sub" x="420" y="284">Trazas de auditoría</text>

  <!-- Destino Externo -->
  <rect class="diag-box-ok" x="516" y="166" width="108" height="52" rx="6" />
  <text class="diag-label" x="570" y="189">Webhook</text>
  <text class="diag-sub" x="570" y="204">Discord / Slack</text>

  <!-- Flechas CI/CD -->
  <line class="diag-line" x1="88" y1="102" x2="88" y2="150" marker-end="url(#arr-finops)" />
  <line class="diag-line" x1="88" y1="206" x2="88" y2="242" marker-end="url(#arr-finops)" />
  <line class="diag-line-dashed" x1="150" y1="272" x2="190" y2="272" marker-end="url(#arr-finops-acc)" />
  <text class="diag-edge" x="159" y="266">IaC</text>

  <!-- Flechas AWS -->
  <line class="diag-line" x1="261" y1="102" x2="261" y2="150" marker-end="url(#arr-finops)" />
  <text class="diag-edge" x="267" y="130">Invoke</text>

  <line class="diag-line-dashed" x1="261" y1="246" x2="261" y2="212" marker-end="url(#arr-finops-acc)" />
  <text class="diag-edge" x="267" y="233">Role</text>

  <path class="diag-line" d="M 328 164 L 343 164 L 343 78 L 354 78" marker-end="url(#arr-finops)" />
  <path class="diag-line" d="M 328 176 L 348 176 L 348 142 L 354 142" marker-end="url(#arr-finops)" />
  <path class="diag-line-dashed" d="M 328 202 L 343 202 L 343 272 L 354 272" marker-end="url(#arr-finops-acc)" />

  <!-- Flecha Webhook -->
  <line class="diag-line" x1="328" y1="192" x2="512" y2="192" marker-end="url(#arr-finops)" />
  <text class="diag-edge" x="405" y="185">HTTPS POST</text>
</svg>
